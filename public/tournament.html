<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAMON - Tournament</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body data-page="tournament">
  <div class="site-bg">
    <div class="site-bg-grid"></div>
    <div class="site-bg-orb orb-1"></div>
    <div class="site-bg-orb orb-2"></div>
    <div class="site-bg-noise"></div>
  </div>

  <div class="page-shell">
    <aside class="brand-rail">
      <a href="./home.html" class="brand-mark">DAMON</a>
      <span class="brand-line"></span>
      <p class="brand-copy">Tournament Mode</p>
    </aside>

    <main class="page-content">
      <div class="premium-topbar">
        <div>
          <p class="eyebrow">ELIMINATION MODE</p>
          <h1 class="page-heading">Tournament Bracket</h1>
          <p class="page-copy">Win your semi-final, survive the final, and become the DAMON tournament champion.</p>
        </div>
        <div class="premium-actions">
          <a class="nav-chip primary" href="./home.html">Back Home</a>
        </div>
      </div>

      <div id="messageBox" class="message-box"></div>

      <section class="content-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">SETUP</p>
            <h2 class="section-heading">Tournament Setup</h2>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="tournamentCategory">Category</label>
            <select id="tournamentCategory">
              <option value="math">Maths</option>
              <option value="banana">Banana API</option>
              <option value="general">General Knowledge</option>
              <option value="programming">Programming</option>
            </select>
          </div>

          <div>
            <label for="tournamentDifficulty">Difficulty</label>
            <select id="tournamentDifficulty">
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
        </div>

        <div class="settings-actions">
          <button id="startTournamentBtn" type="button">Start New Tournament</button>
          <button id="continueTournamentBtn" class="secondary" type="button">Continue Tournament</button>
          <button id="resetTournamentBtn" class="secondary" type="button">Reset Tournament</button>
        </div>
      </section>

      <section class="content-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">BRACKET VIEW</p>
            <h2 class="section-heading">Bracket</h2>
          </div>
        </div>
        <div id="tournamentBracket" class="tournament-bracket"></div>
      </section>
    </main>
  </div>

  <script src="./js/app-state.js"></script>
  <script src="./js/global-ui.js"></script>
  <script src="./js/theme.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/tournament.js"></script>
</body>
</html>
