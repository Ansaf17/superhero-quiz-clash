<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAMON - Shop</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body data-page="shop">
  <div class="site-bg">
    <div class="site-bg-grid"></div>
    <div class="site-bg-orb orb-1"></div>
    <div class="site-bg-orb orb-2"></div>
    <div class="site-bg-noise"></div>
  </div>

  <div class="page-shell">
    <aside class="brand-rail">
      <a href="./home.html" class="brand-mark">DAMON</a>
      <span class="brand-line"></span>
      <p class="brand-copy">Shop Terminal</p>
    </aside>

    <main class="page-content">
      <div class="premium-topbar">
        <div>
          <p class="eyebrow">UPGRADES & COSMETICS</p>
          <h1 class="page-heading">DAMON Shop</h1>
          <p class="page-copy">Spend coins on powerups, strengthen your loadout, and unlock new avatar styles.</p>
        </div>
        <div class="premium-actions">
          <a class="nav-chip" href="./profile.html">Profile</a>
          <a class="nav-chip primary" href="./home.html">Back Home</a>
        </div>
      </div>

      <div id="messageBox" class="message-box"></div>

      <section class="content-panel shop-balance-card">
        <div class="shop-balance-layout">
          <div class="shop-balance-icon">🪙</div>
          <div>
            <h2 style="margin:0;">Your Coins</h2>
            <p id="shopCoinsText" class="shop-coins-text">0 Coins</p>
          </div>
        </div>
      </section>

      <section class="content-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">BATTLE TOOLS</p>
            <h2 class="section-heading">Powerups</h2>
          </div>
        </div>
        <div id="shopPowerupGrid" class="shop-grid"></div>
      </section>

      <section class="content-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">COSMETICS</p>
            <h2 class="section-heading">Avatar Unlocks</h2>
          </div>
        </div>
        <div id="shopAvatarGrid" class="shop-grid"></div>
      </section>
    </main>
  </div>

  <script src="./js/app-state.js"></script>
  <script src="./js/global-ui.js"></script>
  <script src="./js/theme.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/shop.js"></script>
</body>
</html>
