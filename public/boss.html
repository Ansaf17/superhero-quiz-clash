<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAMON - Boss Battle</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body data-page="boss">
  <div class="site-bg">
    <div class="site-bg-grid"></div>
    <div class="site-bg-orb orb-1"></div>
    <div class="site-bg-orb orb-2"></div>
    <div class="site-bg-noise"></div>
  </div>

  <div class="page-shell">
    <aside class="brand-rail">
      <a href="./home.html" class="brand-mark">DAMON</a>
      <span class="brand-line"></span>
      <p class="brand-copy">Boss Protocol</p>
    </aside>

    <main class="page-content">
      <div class="premium-topbar">
        <div>
          <p class="eyebrow">ENDGAME MODE</p>
          <h1 class="page-heading">Boss Battle</h1>
          <p class="page-copy">Choose a legendary DAMON boss, pick your arena category, and enter a high-stakes showdown.</p>
        </div>

        <div class="premium-actions">
          <a class="nav-chip primary" href="./home.html">Back Home</a>
        </div>
      </div>

      <div id="messageBox" class="message-box"></div>

      <section class="content-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">SELECT ENEMY</p>
            <h2 class="section-heading">Choose Boss</h2>
          </div>
        </div>
        <div id="bossGrid" class="boss-grid"></div>
      </section>

      <section class="content-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">SELECT CATEGORY</p>
            <h2 class="section-heading">Battle Category</h2>
          </div>
        </div>

        <div class="grid-2 category-grid">
          <button class="card category-tile active" type="button" data-category="math">
            <span class="tile-glow"></span>
            <h3>➗ Maths</h3>
            <p>Fast calculation rounds</p>
          </button>

          <button class="card category-tile" type="button" data-category="banana">
            <span class="tile-glow"></span>
            <h3>🍌 Banana API</h3>
            <p>Visual banana puzzle questions</p>
          </button>

          <button class="card category-tile" type="button" data-category="general">
            <span class="tile-glow"></span>
            <h3>🌍 General Knowledge</h3>
            <p>Open trivia questions</p>
          </button>

          <button class="card category-tile" type="button" data-category="programming">
            <span class="tile-glow"></span>
            <h3>💻 Programming</h3>
            <p>Computer science questions</p>
          </button>
        </div>
      </section>

      <section class="hero-panel hero-panel-center">
        <div class="hero-panel-copy center-copy">
          <p class="eyebrow">READY</p>
          <h2 class="section-heading">Enter the Boss Arena</h2>
        </div>
        <div class="arena-enter-card premium-center-button">
          <button id="startBossBattleBtn" type="button">Start Boss Battle</button>
        </div>
      </section>
    </main>
  </div>

  <script src="./js/app-state.js"></script>
  <script src="./js/global-ui.js"></script>
  <script src="./js/theme.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/boss.js"></script>
</body>
</html>
