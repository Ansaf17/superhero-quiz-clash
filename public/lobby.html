<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAMON - PVP Lobby</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body data-page="lobby">
  <div class="site-bg">
    <div class="site-bg-grid"></div>
    <div class="site-bg-orb orb-1"></div>
    <div class="site-bg-orb orb-2"></div>
    <div class="site-bg-noise"></div>
  </div>

  <div class="page-shell">
    <aside class="brand-rail">
      <a href="./home.html" class="brand-mark">DAMON</a>
      <span class="brand-line"></span>
      <p class="brand-copy">PVP Lobby</p>
    </aside>

    <main class="page-content">
      <div class="premium-topbar">
        <div>
          <p class="eyebrow">LOCAL MULTIPLAYER</p>
          <h1 class="page-heading">PVP Lobby</h1>
          <p class="page-copy">Player 1 is ready. Player 2 can log in below to join the battle arena.</p>
        </div>
        <div class="premium-actions">
          <a class="nav-chip primary" href="./home.html">Back Home</a>
        </div>
      </div>

      <div id="messageBox" class="message-box"></div>

      <section class="content-panel">
        <div class="vs-layout">
          <section class="card premium-player-card">
            <p class="eyebrow">PLAYER ONE</p>
            <h2>Player 1</h2>
            <div class="hero-pill" id="p1Avatar">🦸</div>
            <p><strong id="p1Name">-</strong></p>
            <p>This player is already logged in.</p>
          </section>

          <div class="vs-text premium-vs-text">VS</div>

          <section class="card premium-player-card">
            <p class="eyebrow">PLAYER TWO</p>
            <h2>Player 2 Login</h2>

            <label for="player2Username">Username</label>
            <input id="player2Username" type="text" placeholder="Enter Player 2 username" />

            <label for="player2Password">Password</label>
            <input id="player2Password" type="password" placeholder="Enter Player 2 password" />

            <button id="confirmPlayer2Btn" type="button">Confirm Player 2</button>

            <div style="margin-top:18px; text-align:center;">
              <div class="hero-pill" id="p2Avatar">🦹</div>
              <p><strong id="p2Name">Waiting...</strong></p>
            </div>
          </section>
        </div>
      </section>

      <section class="hero-panel hero-panel-center">
        <div class="hero-panel-copy center-copy">
          <p class="eyebrow">READY</p>
          <h2 class="section-heading">Continue to Category Selection</h2>
        </div>
        <div class="arena-enter-card premium-center-button">
          <button id="continueBtn" type="button" disabled>Continue to Categories</button>
        </div>
      </section>
    </main>
  </div>

  <script src="./js/app-state.js"></script>
  <script src="./js/global-ui.js"></script>
  <script src="./js/theme.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/lobby.js"></script>
</body>
</html>
